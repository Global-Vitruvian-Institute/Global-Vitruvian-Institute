<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#20242a">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Vitruvian Institute</title>
    <script>
      /*
       * Apply the saved template and reading mode before first paint. The theme
       * stylesheet is created here so a saved template is the first one loaded.
       * Kept in step with appearance.js and reading.js by tests/site.test.mjs.
       */
      (function () {
        try {
          var saved = window.localStorage.getItem('vitruvian.appearance');
          if (saved !== 'clear' && saved !== 'paper' && saved !== 'lilac' && saved !== 'minimal' && saved !== 'things' && saved !== 'blue-topaz') saved = 'clear';
          document.documentElement.setAttribute('data-appearance', saved);
          var theme = document.createElement('link');
          theme.rel = 'stylesheet';
          theme.id = 'theme-stylesheet';
          theme.href = './themes/' + saved + '.css';
          document.head.appendChild(theme);
        } catch (error) {
          /* storage is refused; the default template applies */
        }
        try {
          var reading = window.localStorage.getItem('vitruvian.reading');
          document.documentElement.setAttribute('data-reading', reading === 'stacked' ? 'stacked' : 'page');
        } catch (error) {
          document.documentElement.setAttribute('data-reading', 'page');
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="app-title" id="app-title" href="/">Vitruvian Institute</a>

        <nav class="app-nav" aria-label="Reader">
          <a class="header-link about-link" id="about-link" href="/" hidden>About these notes</a>
          <button class="header-button" id="random-button" type="button" hidden>Random</button>

          <form class="search" id="search-form" role="search" autocomplete="off">
            <input
              class="search-input"
              id="search-input"
              type="search"
              placeholder="Search"
              role="combobox"
              aria-label="Search notes"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="search-results"
              autocomplete="off"
              spellcheck="false"
              disabled
            >
            <kbd class="search-key" id="search-key" aria-hidden="true"></kbd>
            <div class="search-popover" id="search-results" role="listbox" aria-label="Search results" hidden></div>
          </form>

          <button class="header-button user-info-button" id="user-info-button" type="button">Log in</button>
        </nav>
      </header>

      <main class="stack" id="stack" aria-label="Open notes"></main>

      <!--
        The account region is a whole page beside the reader, not a pane: no
        spine, no close control and no horizontal geometry. It is hidden while
        the reader is showing, so exactly one main region is exposed at a time.
      -->
      <main class="account" id="account" hidden aria-label="Account">
        <div class="account-inner">
          <div class="account-return">
            <a class="account-nav-back" id="account-back" data-account-back href="./"><span aria-hidden="true">←</span> Return to notes</a>
          </div>
          <nav class="account-nav" aria-label="Account views">
            <a class="account-nav-link" id="account-user-link" data-account-view="account" href="./?view=account">User info</a>
            <a class="account-nav-link" id="account-settings-link" data-account-view="settings" href="./?view=settings">Settings</a>
            <a class="account-nav-link" id="account-admin-link" data-account-view="admin" href="./?view=admin" hidden>Admin</a>
          </nav>
          <article class="account-content note-content" id="account-content" tabindex="-1"></article>
        </div>
      </main>
    </div>

    <aside class="preview" id="preview" aria-hidden="true" hidden>
      <div class="preview-scale">
        <article class="preview-content note-content" id="preview-content"></article>
      </div>
    </aside>

    <div class="visually-hidden" id="status" role="status" aria-live="polite"></div>

    <!-- Demo dialogs (sign-in, log activity, clear local data) mount here. -->
    <div id="demo-dialog-host"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
